<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darul Amin Ideal Madrasah</title><link rel="icon" href="assets/logo.png"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--t:#0F6E8C;--i:#0B2E3D;--g:#B88A3E;--c:#FBEBD9;--p:#FFF8EE}
*{box-sizing:border-box}body{margin:0;font:18px/1.55 'Hind Siliguri',sans-serif;background:var(--p);color:var(--i)}
header{background:var(--i);color:var(--c);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}header img{height:54px}header h1{font-size:20px;margin:0;flex:1}
a{color:var(--t)}header a{color:var(--c)}.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.sq{aspect-ratio:1;background:#fff;border:3px solid var(--g);border-radius:50% 50% 14px 14px/38% 38% 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--i);text-align:center;padding:12px;transition:transform .2s}.sq:hover{transform:translateY(-4px)}.sq img{width:46%}
.menu{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}.menu a,.btn{background:var(--t);color:#fff;border:0;padding:8px 16px;border-radius:8px;text-decoration:none;font:inherit;cursor:pointer}.menu a.on{background:var(--g)}.btn.g{background:var(--g)}.btn.r{background:#9b2c2c}
.box{background:#fff;border-top:6px solid var(--g);padding:18px 20px;margin:0 0 16px;box-shadow:0 2px 10px rgba(11,46,61,.1)}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #b9a98c;border-radius:6px;width:100%;background:#fff}label{display:block;margin:8px 0 2px;font-weight:500}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
table{border-collapse:collapse;width:100%;background:#fff}td,th{border:1px solid #d9c7a8;padding:6px 10px;text-align:left}th{background:var(--c)}
.tot{font-size:24px;font-weight:700;color:var(--t)}footer{text-align:center;padding:30px}.note{font-size:15px;color:#6b5a3a}
#rc{position:fixed;inset:0;background:rgba(11,46,61,.7);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}#rc>div{background:#fff;padding:28px;max-width:460px;width:100%}
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;background:none}.np{display:none}}
</style></head><body>
<header><img src="assets/logo.png" alt="লোগো"><h1><a href="#/">Darul Amin Ideal Madrasah</a></h1><span id="me"></span></header>
<div id="app"></div>
<footer><button class="btn" onclick="location.hash=ME()?'#/panel':'#/login'">Administration</button><p class="note">ডেমো সংস্করণ: ডেটা শুধু এই ব্রাউজারে সেভ হয়।</p></footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=n=>'৳ '+Number(n||0).toLocaleString('bn-BD'),uid=()=>Math.random().toString(36).slice(2,8),SUB=['বাংলা','ইংরেজি','গণিত'];
const ME=()=>JSON.parse(sessionStorage.me||'null'),save=()=>localStorage.dai=JSON.stringify(DB);
const DB=JSON.parse(localStorage.dai||'null')||(()=>{const d={branches:[{id:'b1',name:'প্রধান শাখা',addr:'শেরপুর, রাজশাহী',phone:'01700-000000',email:'info@example.com'},{id:'b2',name:'উত্তর শাখা',addr:'[ঠিকানা]',phone:'[মোবাইল]',email:'[ইমেইল]'}],
users:[{u:'admin',p:'admin123',role:'super',name:'মূল অ্যাডমিন'},{u:'coord1',p:'1234',role:'coord',bid:'b1',name:'কো-অর্ডিনেটর'},{u:'acct1',p:'1234',role:'acct',bid:'b1',name:'হিসাব কর্মকর্তা'}],
students:[['S001','আব্দুল্লাহ','রহিম','৫','ক','1'],['S002','ফাতিমা','করিম','৫','ক','2'],['S003','হাসান','জামাল','৬','খ','1']].map(a=>({id:a[0],bid:'b1',name:a[1],father:a[2],cls:a[3],sec:a[4],roll:a[5]})),
res:{S001:{বাংলা:85,ইংরেজি:78,গণিত:90},S002:{বাংলা:92,ইংরেজি:88,গণিত:81}},
notices:[{id:'n1',bid:'b1',title:'ভর্তি চলছে',body:'[নোটিশের বিস্তারিত]',aud:'সকলের'}],pend:[],gallery:[{bid:'b1',title:'বার্ষিক ক্রীড়া',body:'[ইভেন্টের বিবরণ]'}],
staff:[{bid:'b1',name:'[প্রধান শিক্ষক]',role:'প্রধান',mobile:'[মোবাইল]'}],fees:[{id:'f1',name:'মাসিক বেতন',amt:500},{id:'f2',name:'পরিবহণ ভাড়া',amt:300},{id:'f3',name:'অন্যান্য',amt:100}],
inc:[],exp:[],cats:['বিদ্যুৎ বিল','স্টেশনারি']};localStorage.dai=JSON.stringify(d);return d})();
let T='',V='',CL='৫',ST=null,RC=null,Q='';
const mine=k=>DB[k].filter(x=>x.bid==ME().bid&&!x.del);
function home(){return`<div class=wrap><h2>আমাদের শাখাসমূহ</h2><div class=grid>${DB.branches.map(b=>`<a class=sq href="#/b/${b.id}"><img src="assets/logo.png" alt=""><b>${esc(b.name)}</b></a>`).join('')}</div></div>`}
function card(s){const r=DB.res[s.id];return`<div class=box><b>${esc(s.name)}</b> (আইডি ${esc(s.id)}, শ্রেণি ${esc(s.cls)}-${esc(s.sec)}, রোল ${esc(s.roll)})${r?`<table><tr>${SUB.map(x=>`<th>${x}</th>`).join('')}</tr><tr>${SUB.map(x=>`<td>${r[x]??'-'}</td>`).join('')}</tr></table><p><button class="btn np" onclick="print()">প্রিন্ট / PDF</button></p>`:'<p>রেজাল্ট এখনো প্রকাশিত হয়নি।</p>'}</div>`}
function branch(id,pg){const b=DB.branches.find(x=>x.id==id);if(!b)return home();
const M=[['notice','Notice'],['admission','Admission'],['result','Result'],['gallery','Gallery'],['admin','Administration'],['contact','Contact'],['slogin','Student & Teachers Login']];let h='';
if(pg=='notice')h=DB.notices.filter(n=>n.bid==id&&!n.del&&n.aud!='শিক্ষকদের').map(n=>`<div class=box><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div>`).join('')||'<p>কোনো নোটিশ নেই।</p>';
else if(pg=='admission')h=`<form class=box onsubmit="adm(event,'${id}')"><div class=f>${[['name','নাম'],['father','পিতার নাম'],['mother','মাতার নাম'],['cls','ক্লাস'],['addr','ঠিকানা'],['mobile','মোবাইল'],['email','ইমেইল']].map(f=>`<div><label>${f[1]}</label><input name=${f[0]} required></div>`).join('')}</div><button class=btn style="margin-top:14px">ভর্তির আবেদন জমা দিন</button><p class=note>ছবি আপলোড ও অটো রিসাইজ (১০০KB) ব্যাকএন্ড সংস্করণে থাকবে।</p></form>`;
else if(pg=='result'||pg=='slogin')h=`<form class=box onsubmit="srch(event,'${id}','${pg}')"><div class=f><div><label>স্টুডেন্ট আইডি</label><input name=sid required placeholder="S001"></div><div><label>${pg=='result'?'রোল':'ক্লাস'}</label><input name=k required placeholder="${pg=='result'?'1':'৫'}"></div></div><button class=btn style="margin-top:12px">${pg=='result'?'রেজাল্ট দেখুন':'লগইন'}</button></form><div id=rs>${Q}</div>`;
else if(pg=='gallery')h=DB.gallery.filter(g=>g.bid==id).map(g=>`<div class=box><b>${esc(g.title)}</b><p>${esc(g.body)}</p></div>`).join('');
else if(pg=='admin')h=`<table><tr><th>নাম</th><th>পদবি</th><th>মোবাইল</th></tr>${DB.staff.filter(s=>s.bid==id).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.role)}</td><td>${esc(s.mobile)}</td></tr>`).join('')}</table>`;
else if(pg=='contact')h=`<div class=box><p>ঠিকানা: ${esc(b.addr)}</p><p>মোবাইল: ${esc(b.phone)}</p><p>ইমেইল: ${esc(b.email)}</p></div>`;
else h=`<div class=box><h3>${esc(b.name)}</h3><p>${esc(b.addr)}</p><p>উপরের মেন্যু থেকে নোটিশ, ভর্তি ও রেজাল্ট দেখুন।</p></div>`;
return`<div class=wrap><h2>${esc(b.name)}</h2><div class=menu>${M.map(m=>`<a class="${pg==m[0]?'on':''}" href="#/b/${id}/${m[0]}">${m[1]}</a>`).join('')}</div>${h}</div>`}
function adm(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));DB.pend.push({...d,id:uid(),bid:id});save();e.target.outerHTML='<div class=box>আবেদন জমা হয়েছে। ধন্যবাদ।</div>'}
function srch(e,id,pg){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),s=DB.students.find(x=>x.bid==id&&!x.del&&x.id.toLowerCase()==d.sid.trim().toLowerCase()&&(pg=='result'?x.roll==d.k.trim():x.cls==d.k.trim()));$('#rs').innerHTML=s?card(s):'<p>কোনো তথ্য পাওয়া যায়নি।</p>'}
function loginV(){return`<div class=wrap style="max-width:440px"><form class=box onsubmit="login(event)"><h3>Administration লগইন</h3><label>ইউজারনেম</label><input name=u required><label>পাসওয়ার্ড</label><input name=p type=password required><button class=btn style="margin-top:12px">লগইন</button><p class=note>ডেমো: admin / admin123 (মূল অ্যাডমিন), coord1 / 1234 (কো-অর্ডিনেটর), acct1 / 1234 (হিসাব কর্মকর্তা)</p></form></div>`}
function login(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),u=DB.users.find(x=>x.u==d.u&&x.p==d.p);if(!u)return alert('ইউজারনেম বা পাসওয়ার্ড ভুল');sessionStorage.me=JSON.stringify(u);T='';V='';location.hash='#/panel';render()}
function out(){sessionStorage.removeItem('me');location.hash='#/'}
const tabs=(a)=>`<div class=menu>${a.map(t=>`<a class="${(T||a[0])==t?'on':''}" href="#/panel" onclick="T='${t}';render()">${t}</a>`).join('')}</div>`;
function panel(){const m=ME();if(!m){location.hash='#/login';return''}return m.role=='super'?superV():m.role=='coord'?coordV():acctV()}
function superV(){if(V){const b=DB.branches.find(x=>x.id==V),st=DB.students.filter(s=>s.bid==V&&!s.del),i=DB.inc.filter(x=>x.bid==V).reduce((a,x)=>a+x.amt,0),e=DB.exp.filter(x=>x.bid==V).reduce((a,x)=>a+x.amt,0);
return`<div class=wrap><button class=btn onclick="V='';render()">← সব শাখা</button><h2>${esc(b.name)} (শুধু দেখা)</h2><div class=box>শিক্ষার্থী: ${st.length} | আয়: ${fmt(i)} | ব্যয়: ${fmt(e)}</div><table><tr><th>আইডি</th><th>নাম</th><th>ক্লাস</th></tr>${st.map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.cls)}-${esc(s.sec)}</td></tr>`).join('')}</table></div>`}
return`<div class=wrap><h2>সব শাখা</h2><div class=grid>${DB.branches.map(b=>`<a class=sq href="#/panel" onclick="V='${b.id}';render()"><img src="assets/logo.png" alt=""><b>${esc(b.name)}</b></a>`).join('')}</div>
<form class=box style="margin-top:24px" onsubmit="nb(event)"><h3>নতুন ব্রাঞ্চ</h3><div class=f><div><label>ব্রাঞ্চের নাম</label><input name=name required></div><div><label>ঠিকানা</label><input name=addr></div></div><button class=btn style="margin-top:12px">ব্রাঞ্চ তৈরি করুন</button></form>
<form class=box onsubmit="ns(event)"><h3>স্টাফ আইডি তৈরি</h3><div class=f><div><label>শাখা</label><select name=bid>${DB.branches.map(b=>`<option value=${b.id}>${esc(b.name)}</option>`).join('')}</select></div><div><label>পদবি</label><select name=role><option value=coord>Co-ordinator</option><option value=acct>Accounts officer</option></select></div><div><label>নাম</label><input name=name required></div><div><label>ইউজারনেম</label><input name=u required></div><div><label>পাসওয়ার্ড</label><input name=p required></div></div><button class=btn style="margin-top:12px">আইডি তৈরি করুন</button></form></div>`}
function nb(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));DB.branches.push({id:'b'+uid(),name:d.name,addr:d.addr||'',phone:'',email:''});save();render()}
function ns(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));DB.users.push(d);save();alert('আইডি তৈরি হয়েছে');e.target.reset()}
function coordV(){const A=['নোটিশ','শিক্ষার্থী','ভর্তি','রেজাল্ট'],t=T||A[0],b=ME().bid;let h='';const cls=()=>`<select onchange="CL=this.value;render()">${['৫','৬','৭'].map(c=>`<option ${c==CL?'selected':''}>${c}</option>`).join('')}</select>`;
if(t=='নোটিশ')h=`<form class=box onsubmit="nn(event)"><div class=f><div><label>শিরোনাম</label><input name=title required></div><div><label>দর্শক</label><select name=aud><option>সকলের</option><option>শিক্ষকদের</option></select></div></div><label>বিস্তারিত</label><textarea name=body></textarea><button class=btn style="margin-top:12px">নোটিশ দিন</button></form>`+mine('notices').map(n=>`<div class=box><b>${esc(n.title)}</b> (${n.aud}) <button class="btn r" onclick="del('notices','${n.id}')">ডিলিট</button></div>`).join('');
if(t=='শিক্ষার্থী')h=`<form class=box onsubmit="ne(event)"><h3>New Student</h3><div class=f>${[['name','নাম'],['father','পিতার নাম'],['cls','ক্লাস'],['sec','সেকশন'],['roll','রোল']].map(f=>`<div><label>${f[1]}</label><input name=${f[0]} required></div>`).join('')}</div><button class=btn style="margin-top:12px">সাবমিট</button></form><p>ক্লাস ${cls()} <button class="btn g" onclick="print()">প্রিন্ট</button></p><table><tr><th>আইডি</th><th>নাম</th><th>সেকশন</th><th>রোল</th><th></th></tr>${mine('students').filter(s=>s.cls==CL).map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.sec)}</td><td>${esc(s.roll)}</td><td><button class="btn r" onclick="del('students','${s.id}')">ডিলিট</button></td></tr>`).join('')}</table>`;
if(t=='ভর্তি')h=mine('pend').map(p=>`<div class=box><b>${esc(p.name)}</b> (পিতা: ${esc(p.father)}, ক্লাস ${esc(p.cls)}, ${esc(p.mobile)}) <button class=btn onclick="ap('${p.id}')">অনুমোদন</button> <button class="btn r" onclick="del('pend','${p.id}')">বাতিল</button></div>`).join('')||'<p>কোনো আবেদন নেই।</p>';
if(t=='রেজাল্ট')h=`<p>ক্লাস ${cls()}</p><table><tr><th>নাম</th>${SUB.map(x=>`<th>${x}</th>`).join('')}</tr>${mine('students').filter(s=>s.cls==CL).map(s=>`<tr><td>${esc(s.name)}</td>${SUB.map(x=>`<td><input value="${DB.res[s.id]?.[x]??''}" onchange="mk('${s.id}','${x}',this.value)"></td>`).join('')}</tr>`).join('')}</table><p class=note>মার্ক বসালেই সেভ হয়, পেজ রিলোড হয় না।</p>`;
return`<div class=wrap><h2>কো-অর্ডিনেটর প্যানেল</h2>${tabs(A)}${h}</div>`}
const del=(k,id)=>{const x=DB[k].find(y=>y.id==id);x.del=1;save();render()};
function nn(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));DB.notices.push({...d,id:uid(),bid:ME().bid});save();render()}
function ne(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));DB.students.push({...d,id:'S'+String(DB.students.length+1).padStart(3,'0'),bid:ME().bid});save();render()}
function ap(id){const p=DB.pend.find(x=>x.id==id);p.del=1;DB.students.push({id:'S'+String(DB.students.length+1).padStart(3,'0'),bid:p.bid,name:p.name,father:p.father,cls:p.cls,sec:'ক',roll:String(DB.students.length+1)});save();render()}
function mk(s,x,v){(DB.res[s]=DB.res[s]||{})[x]=v;save()}
function acctV(){const A=['আয়','ব্যয়','রিপোর্ট'],t=T||A[0],b=ME().bid;let h='';
if(t=='আয়'){h=`<form class=box onsubmit="fs(event)"><label>স্টুডেন্ট আইডি</label><input name=sid placeholder="S001" required><button class=btn style="margin-top:10px">খুঁজুন</button></form>`;
if(ST)h+=`<div class=box><b>${esc(ST.name)}</b> (${ST.id}, ক্লাস ${esc(ST.cls)}-${esc(ST.sec)}, রোল ${esc(ST.roll)}, পিতা ${esc(ST.father)})<h4>ফি কার্ট</h4>${DB.fees.map((f,i)=>`<label><input type=checkbox style="width:auto" data-a="${f.amt}" data-n="${esc(f.name)}" onchange="ct()"> ${i+1}. ${esc(f.name)} (${fmt(f.amt)})</label>`).join('')}<p class=tot>মোট: <span id=tt>${fmt(0)}</span></p><button class=btn onclick="pay()">সাবমিট ও রিসিট</button></div>`;
h+=`<form class=box onsubmit="oi(event)"><h4>অন্যান্য আয়</h4><div class=f><div><label>খাত</label><input name=cat required></div><div><label>টাকা</label><input name=amt type=number required></div></div><button class="btn g" style="margin-top:10px">সংরক্ষণ</button></form><form class=box onsubmit="nf(event)"><h4>নতুন ফি খাত (ডায়নামিক)</h4><div class=f><div><label>নাম</label><input name=name required></div><div><label>টাকা</label><input name=amt type=number required></div></div><button class="btn g" style="margin-top:10px">ফি খাত যোগ</button></form>`}
if(t=='ব্যয়')h=`<form class=box onsubmit="ex(event)"><h4>নতুন ব্যয়</h4><div class=f><div><label>খাত</label><input name=cat list=cl required></div><div><label>টাকার পরিমাণ</label><input name=amt type=number required></div><div><label>ব্যয়কারীর নাম</label><input name=who required></div></div><datalist id=cl>${DB.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist><button class=btn style="margin-top:10px">সাবমিট</button></form><table><tr><th>তারিখ</th><th>খাত</th><th>টাকা</th><th>কে</th></tr>${mine('exp').map(x=>`<tr><td>${x.d}</td><td>${esc(x.cat)}</td><td>${fmt(x.amt)}</td><td>${esc(x.who)}</td></tr>`).join('')}</table>`;
if(t=='রিপোর্ট'){const m=window.RM||new Date().toISOString().slice(0,7),i=mine('inc').filter(x=>x.d.startsWith(m)),e=mine('exp').filter(x=>x.d.startsWith(m)),s=a=>a.reduce((n,x)=>n+x.amt,0);
h=`<p>মাস: <input type=month value="${m}" style="width:auto" onchange="RM=this.value;render()"> <button class="btn g" onclick="print()">প্রিন্ট</button></p><div class=box><p>আয়: ${fmt(s(i))}</p><p>ব্যয়: ${fmt(s(e))}</p><p class=tot>উদ্বৃত্ত: ${fmt(s(i)-s(e))}</p></div>`}
return`<div class=wrap><h2>হিসাব বিভাগ</h2>${tabs(A)}${h}</div>${RC?`<div id=rc><div><h3>ফি রিসিট</h3><p>${RC.d} | ${esc(RC.nm)} (${RC.sid})</p><table>${RC.items.map(i=>`<tr><td>${esc(i[0])}</td><td>${fmt(i[1])}</td></tr>`).join('')}</table><p class=tot>মোট: ${fmt(RC.amt)}</p><button class="btn np" onclick="print()">প্রিন্ট / PDF</button> <button class="btn r np" onclick="RC=null;render()">বন্ধ</button></div></div>`:''}`}
function fs(e){e.preventDefault();const id=new FormData(e.target).get('sid').trim().toLowerCase();ST=mine('students').find(s=>s.id.toLowerCase()==id)||null;if(!ST)alert('শিক্ষার্থী পাওয়া যায়নি');render()}
function ct(){let n=0;document.querySelectorAll('[data-a]:checked').forEach(c=>n+=+c.dataset.a);$('#tt').textContent=fmt(n)}
function pay(){const it=[...document.querySelectorAll('[data-a]:checked')].map(c=>[c.dataset.n,+c.dataset.a]);if(!it.length)return alert('অন্তত একটি ফি বেছে নিন');const amt=it.reduce((n,x)=>n+x[1],0),d=new Date().toISOString().slice(0,10);DB.inc.push({bid:ME().bid,d,cat:'শিক্ষার্থী ফি',amt,sid:ST.id});save();RC={d,nm:ST.name,sid:ST.id,items:it,amt};ST=null;render()}
function oi(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));DB.inc.push({bid:ME().bid,d:new Date().toISOString().slice(0,10),cat:d.cat,amt:+d.amt});save();e.target.reset();alert('সংরক্ষিত হয়েছে')}
function nf(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));DB.fees.push({id:uid(),name:d.name,amt:+d.amt});save();render()}
function ex(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!DB.cats.includes(d.cat))DB.cats.push(d.cat);DB.exp.push({bid:ME().bid,d:new Date().toISOString().slice(0,10),cat:d.cat,amt:+d.amt,who:d.who});save();render()}
function render(){const p=(location.hash.slice(1)||'/').split('/'),y=scrollY,m=ME();$('#me').innerHTML=m?`${esc(m.name)} <a href="#/" onclick="out()">লগআউট</a>`:'';
$('#app').innerHTML=p[1]=='b'?branch(p[2],p[3]||''):p[1]=='login'?loginV():p[1]=='panel'?panel():home();scrollTo(0,y)}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script></body></html>
